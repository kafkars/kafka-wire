[workspace]
members = [
    "crates/kafka-wire-core",
    "crates/kafka-wire-schema",
    "crates/kafka-wire-codegen",
    "crates/kafka-wire",
    "crates/kafka-wire-records",
    "crates/kafka-wire-conformance",
    "xtask",
]
default-members = [
    "crates/kafka-wire-core",
    "crates/kafka-wire-schema",
    "crates/kafka-wire-codegen",
    "crates/kafka-wire",
    "crates/kafka-wire-records",
    "xtask",
]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-rc.3"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/kafkars/kafka-wire"

[workspace.dependencies]
bytes = "1.10"
heck = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0"
toml = "0.8"
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
