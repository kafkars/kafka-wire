[package]
name = "kafka-wire-records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Kafka record-batch encoding, decoding, and compression primitives"
publish = ["crates-io"]
readme = "README.md"
keywords = ["kafka", "record-batch", "compression"]
categories = ["encoding", "network-programming"]

[dependencies]
bytes.workspace = true
crc32c = "0.6"
flate2 = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["frame"] }
snap = "1"
zstd = "0.13"
kafka-wire-core = { version = "0.1.0-rc.3", path = "../kafka-wire-core" }
thiserror.workspace = true

[lints]
workspace = true
