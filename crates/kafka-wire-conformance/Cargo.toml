[package]
name = "kafka-wire-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# This crate judges `kafka-wire` against bytes Apache Kafka authored. It is
# deliberately a leaf: nothing depends on it, it is excluded from the workspace
# default members, and it never appears in a consumer's dependency graph.

[dependencies]
bytes.workspace = true
kafka-wire = { path = "../kafka-wire" }
kafka-wire-records = { path = "../kafka-wire-records" }
kafka-wire-core = { path = "../kafka-wire-core" }
serde.workspace = true
serde_json.workspace = true

# The defaults comparison reads this repository's own lowering — the semantic
# schema front end — so it can hold Kafka's reported defaults against the IR the
# generator renders from. It is a test-only edge: the corpus judges the protocol
# crate, and reaching the front end that fed it is judging, not building on it.
[dev-dependencies]
kafka-wire-schema = { path = "../kafka-wire-schema" }
toml.workspace = true

[lints]
workspace = true
