name: Fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fuzz:
    name: build and smoke fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out kafka-wire
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify fuzz-sensitive changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          relevant=true
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" &&
              git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
                .github/workflows/fuzz.yml Cargo.lock Cargo.toml crates fuzz \
                scripts/fuzz-seeds spec; then
              relevant=false
            fi
          fi
          printf 'relevant=%s\n' "$relevant" >>"$GITHUB_OUTPUT"

      - name: Report unchanged fuzz surface
        if: steps.changes.outputs.relevant != 'true'
        shell: bash
        run: echo "No fuzz-sensitive paths changed; the required status is satisfied."

      - name: Install pinned nightly toolchain
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: rustup toolchain install nightly-2026-08-01 --profile minimal

      - name: Install pinned cargo-fuzz
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: cargo +nightly-2026-08-01 install cargo-fuzz --locked --version 0.13.2

      - name: Verify locked fuzz dependencies
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: >-
          cargo +nightly-2026-08-01 metadata --locked
          --manifest-path fuzz/Cargo.toml --format-version 1 --no-deps
          > /dev/null

      - name: Verify checked fuzz seeds
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: scripts/fuzz-seeds --check

      - name: Build every fuzz target
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        working-directory: fuzz
        run: cargo +nightly-2026-08-01 fuzz build

      - name: Run scheduled smoke campaigns
        if: >-
          steps.changes.outputs.relevant == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: bash
        working-directory: fuzz
        run: |
          for target in jsonc schema_values wire_decode record_batch generated_roundtrip; do
            cargo +nightly-2026-08-01 fuzz run "$target" -- -runs=256
          done
