name: Maintenance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out kafka-wire
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install maintenance toolchain
        shell: bash
        run: rustup toolchain install 1.93.0 --profile minimal

      - name: Install pinned cargo-deny
        shell: bash
        run: cargo +1.93.0 install cargo-deny --locked --version 0.20.2

      - name: Check advisories, licenses, versions, and sources
        shell: bash
        run: cargo +1.93.0 deny check

  public-api:
    name: public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out kafka-wire with release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install maintenance toolchain
        shell: bash
        run: rustup toolchain install 1.93.0 --profile minimal

      - name: Install pinned cargo-semver-checks
        shell: bash
        run: cargo +1.93.0 install cargo-semver-checks --locked --version 0.50.0

      - name: Compare public crates with the signed RC baseline
        shell: bash
        run: |
          for package in kafka-wire-core kafka-wire kafka-wire-records; do
            cargo +1.93.0 semver-checks check-release \
              --package "$package" \
              --baseline-rev v0.1.0-rc.1 \
              --release-type patch
          done
