[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bytes.workspace = true
kafka-wire-codegen = { version = "0.1.0-rc.3", path = "../crates/kafka-wire-codegen" }
# `records --refresh` asks Apache Kafka to read bytes THIS repository wrote, which
# means it has to write them; the compressor that does lives here. xtask carries
# those bytes to the oracle and holds no opinion about them.
kafka-wire-records = { version = "0.1.0-rc.3", path = "../crates/kafka-wire-records" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
# Architecture tests parse Rust paths rather than matching source substrings.
syn = { workspace = true, features = ["visit"] }
walkdir.workspace = true

[lints]
workspace = true
